<!doctype html>
<html lang="en" class="h-full bg-slate-50">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OmniTrack - 3-Tier Content & Request System</title>
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Marked.js for Markdown Rendering -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest"></script>
        <!-- Inter Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Inter", sans-serif;
            }
            .prose table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 0.5rem;
                margin-bottom: 0.5rem;
            }
            .prose th,
            .prose td {
                border: 1px solid #cbd5e1;
                padding: 0.375rem 0.75rem;
                text-align: left;
                font-size: 0.875rem;
            }
            .prose th {
                background-color: #f1f5f9;
                font-weight: 600;
            }
            .prose a {
                color: #2563eb;
                text-decoration: underline;
            }
            .prose p {
                margin-bottom: 0.5rem;
            }
            .prose ul {
                list-style-type: disc;
                padding-left: 1.25rem;
                margin-bottom: 0.5rem;
            }
            .prose ol {
                list-style-type: decimal;
                padding-left: 1.25rem;
                margin-bottom: 0.5rem;
            }

            @keyframes spin-once {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
            .animate-spin-once {
                animation: spin-once 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            }
        </style>
    </head>
    <body class="h-full flex flex-col text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
        <!-- Header -->
        <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 shrink-0">
            <div
                class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4"
            >
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                        <i data-lucide="layers" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                            OmniTrack
                            <span
                                class="text-xs font-semibold uppercase bg-indigo-500/30 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30"
                                >3-Tier System</span
                            >
                        </h1>
                        <p class="text-xs text-slate-400">Roles → Responsibilities → Requests</p>
                    </div>
                </div>

                <!-- Global Action Buttons & Tab Switcher -->
                <div class="flex flex-wrap items-center gap-3">
                    <div class="bg-slate-800 p-1 rounded-xl flex items-center border border-slate-700">
                        <button
                            onclick="switchTab('hierarchy')"
                            id="tab-btn-hierarchy"
                            class="px-4 py-1.5 text-xs font-medium rounded-lg transition-all flex items-center gap-2 bg-indigo-600 text-white shadow"
                        >
                            <i data-lucide="folder-tree" class="w-4 h-4"></i> Roles Hierarchy
                        </button>
                        <button
                            onclick="switchTab('requests')"
                            id="tab-btn-requests"
                            class="px-4 py-1.5 text-xs font-medium rounded-lg transition-all flex items-center gap-2 text-slate-300 hover:text-white"
                        >
                            <i data-lucide="check-square" class="w-4 h-4"></i> Master Requests
                        </button>
                    </div>

                    <!-- Refresh Button -->
                    <button
                        onclick="fetchDataFromGraphQL()"
                        id="refresh-btn"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-semibold p-2 rounded-xl border border-slate-700 transition-all flex items-center gap-1.5"
                        title="Refresh Data from GraphQL"
                    >
                        <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
                        <span class="hidden md:inline">Sync</span>
                    </button>

                    <!-- Global Add Menu Dropdown -->
                    <div class="relative" id="new-item-menu-container">
                        <button
                            onclick="toggleNewMenu(event)"
                            class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1.5 active:scale-95"
                        >
                            <i data-lucide="plus" class="w-4 h-4"></i> New Item
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-70"></i>
                        </button>
                        <div
                            id="new-item-dropdown"
                            class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-200 py-1 hidden z-50 text-slate-700 text-xs"
                        >
                            <button
                                onclick="handleNewMenuAction('role')"
                                class="w-full text-left px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2"
                            >
                                <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i> New Role
                            </button>
                            <button
                                onclick="handleNewMenuAction('responsibility')"
                                class="w-full text-left px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2"
                            >
                                <i data-lucide="git-commit" class="w-3.5 h-3.5"></i> New Responsibility
                            </button>
                            <button
                                onclick="handleNewMenuAction('request')"
                                class="w-full text-left px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2"
                            >
                                <i data-lucide="check-square" class="w-3.5 h-3.5"></i> New Request
                            </button>
                        </div>
                    </div>

                    <!-- Settings & Data Menu Dropdown -->
                    <div class="relative" id="settings-menu-container">
                        <button
                            onclick="toggleSettingsMenu(event)"
                            class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-semibold p-2 rounded-xl border border-slate-700 transition-all flex items-center justify-center"
                            title="Settings & Data"
                        >
                            <i data-lucide="settings" class="w-4 h-4"></i>
                        </button>
                        <div
                            id="settings-dropdown"
                            class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-200 py-1 hidden z-50 text-slate-700 text-xs"
                        >
                            <button
                                onclick="handleSettingsMenuAction('config')"
                                class="w-full text-left px-4 py-2 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2 font-medium"
                            >
                                <i data-lucide="server" class="w-3.5 h-3.5 text-indigo-500"></i> Configure GraphQL API
                            </button>
                            <div class="border-t border-slate-100 my-1"></div>
                            <button
                                onclick="handleSettingsMenuAction('reset')"
                                class="w-full text-left px-4 py-2 hover:bg-slate-50 flex items-center gap-2 text-rose-600"
                            >
                                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Sample Data
                            </button>
                            <button
                                onclick="handleSettingsMenuAction('export')"
                                class="w-full text-left px-4 py-2 hover:bg-slate-50 flex items-center gap-2"
                            >
                                <i data-lucide="download" class="w-3.5 h-3.5"></i> Export JSON
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 overflow-y-auto">
            <!-- Toast Notification -->
            <div
                id="toast"
                class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-800 text-xs font-medium"
            >
                <span id="toast-icon"></span>
                <span id="toast-message"></span>
            </div>

            <!-- TAB 1: ROLES HIERARCHY -->
            <div id="tab-hierarchy" class="space-y-6">
                <!-- Filter Bar for Hierarchy -->
                <div
                    class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4"
                >
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <div class="relative flex-1 sm:w-80">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                            <input
                                type="text"
                                id="hierarchy-search"
                                oninput="renderHierarchy()"
                                placeholder="Search roles, responsibilities, requests..."
                                class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                            />
                        </div>
                    </div>
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                        <label
                            class="flex items-center gap-2 text-xs font-medium text-slate-600 cursor-pointer select-none bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"
                        >
                            <input
                                type="checkbox"
                                id="show-closed-toggle"
                                onchange="renderHierarchy()"
                                class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4"
                            />
                            Show Closed Roles
                        </label>
                        <button
                            onclick="expandAllHierarchy(true)"
                            class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 px-3 py-2 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all"
                        >
                            Expand All
                        </button>
                        <button
                            onclick="expandAllHierarchy(false)"
                            class="text-xs font-semibold text-slate-600 hover:text-slate-800 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all"
                        >
                            Collapse All
                        </button>
                    </div>
                </div>

                <!-- Roles Container -->
                <div id="roles-container" class="space-y-4">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- TAB 2: MASTER REQUEST LIST -->
            <div id="tab-requests" class="space-y-6 hidden">
                <!-- Filter & Sort Header -->
                <div
                    class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4"
                >
                    <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                        <div class="relative flex-1 md:w-72">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                            <input
                                type="text"
                                id="req-search"
                                oninput="renderRequestsList()"
                                placeholder="Search request content..."
                                class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                            />
                        </div>
                        <select
                            id="req-filter-status"
                            onchange="renderRequestsList()"
                            class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                        >
                            <option value="ALL">All Statuses</option>
                            <option value="Ready">Ready</option>
                            <option value="Working">Working</option>
                            <option value="Complete">Complete</option>
                        </select>
                        <select
                            id="req-filter-role"
                            onchange="renderRequestsList()"
                            class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                        >
                            <option value="ALL">All Roles</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-slate-500">
                        <span class="flex items-center gap-1"
                            ><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span> Overdue</span
                        >
                        <span class="flex items-center gap-1 ml-2"
                            ><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> Due Soon
                            (&le;3d)</span
                        >
                        <span class="flex items-center gap-1 ml-2"
                            ><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> On Track</span
                        >
                    </div>
                </div>

                <!-- Requests Table / List Container -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div id="master-requests-container" class="divide-y divide-slate-100">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </main>

        <!-- MODAL CONTAINER -->
        <div
            id="modal-backdrop"
            class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-200"
        >
            <div
                id="modal-box"
                class="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] flex flex-col transform scale-95 transition-all duration-200 overflow-hidden border border-slate-100"
            >
                <!-- Modal Header -->
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 id="modal-title" class="font-bold text-slate-800 text-sm">Modal Title</h3>
                    <button
                        onclick="closeModal()"
                        class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200/50 transition-all"
                    >
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <!-- Modal Body -->
                <div id="modal-content" class="p-6 overflow-y-auto space-y-4 text-xs">
                    <!-- Form injected dynamically -->
                </div>
            </div>
        </div>

        <!-- Application Script -->
        <script>
            // --- DATA MODEL & DEFAULT STATE ---
            const DEFAULT_DATA = {
                roles: [
                    {
                        id: "role-1",
                        title: "Tech Lead for Team A",
                        description:
                            "Managing engineering deliverables, architectural standards, and technical roadmap for Team A.\n\n### Key Resources\n- [Team Wiki & Docs](https://www.google.com)\n- [Architecture Board Review](https://www.google.com)\n\n| Quarter | Focus Area | Status |\n|---|---|---|\n| Q1 | Core Scalability | In Progress |\n| Q2 | Multi-Region Auth | Planned |",
                        status: "OPEN",
                        createdAt: "2026-01-10",
                    },
                    {
                        id: "role-2",
                        title: "Homeowner",
                        description:
                            "Maintaining property value, home safety, regular systems maintenance, and improvement projects.\n\n### Useful Links\n- [Home Insurance Portal](https://www.google.com)\n- [Neighborhood HOA Guidelines](https://www.google.com)",
                        status: "OPEN",
                        createdAt: "2026-02-01",
                    },
                    {
                        id: "role-3",
                        title: "Church Deacon",
                        description:
                            "Serving on community welfare, benevolence fund allocation, and facilities upkeep.\n*(Note: Completed 3-year term in Dec 2025)*",
                        status: "CLOSED",
                        createdAt: "2023-01-15",
                    },
                ],
                responsibilities: [
                    {
                        id: "resp-1",
                        roleId: "role-1",
                        title: "Lead for Feature X Development",
                        description:
                            "Drive end-to-end design, implementation, and deployment of Feature X authentication and scaling microservices.",
                        status: "In Progress",
                    },
                    {
                        id: "resp-2",
                        roleId: "role-1",
                        title: "Team Mentorship & Reviews",
                        description:
                            "Conduct weekly 1-on-1s, technical career planning, and code review standard enforcement.",
                        status: "Active",
                    },
                    {
                        id: "resp-3",
                        roleId: "role-2",
                        title: "Monthly Home Maintenance",
                        description: "Execute routine preventive maintenance tasks around the house.",
                        status: "Active",
                    },
                    {
                        id: "resp-4",
                        roleId: "role-3",
                        title: "Benevolence Fund Audits",
                        description:
                            "Review quarterly financial disbursements and ensure compliance with council bylaws.",
                        status: "Completed",
                    },
                ],
                requests: [
                    {
                        id: "req-1",
                        responsibilityId: "resp-1",
                        description:
                            "Complete API Design Document\nDraft the OpenAPI 3.0 specification for Auth endpoints and share with security engineering team for formal review.",
                        dueDate: new Date(Date.now() + 86400000 * 2).toISOString().split("T")[0],
                        status: "Working",
                    },
                    {
                        id: "req-2",
                        responsibilityId: "resp-1",
                        description:
                            "Setup Kubernetes Staging Cluster\nProvision dedicated staging namespace, configure ingress controllers, and run automated smoke tests.",
                        dueDate: new Date(Date.now() - 86400000 * 3).toISOString().split("T")[0],
                        status: "Ready",
                    },
                    {
                        id: "req-3",
                        responsibilityId: "resp-2",
                        description:
                            "Submit Q2 Performance Review Summaries\nCompile feedback reports and submit them to the HR portal for all 5 direct reports.",
                        dueDate: new Date(Date.now() + 86400000 * 1).toISOString().split("T")[0],
                        status: "Working",
                    },
                    {
                        id: "req-4",
                        responsibilityId: "resp-3",
                        description:
                            "Replace HVAC Air Filters\nChange furnace and AC air filters in basement utility room and attic unit.",
                        dueDate: new Date().toISOString().split("T")[0],
                        status: "Ready",
                    },
                    {
                        id: "req-5",
                        responsibilityId: "resp-4",
                        description:
                            "Finalize Year-End Financial Audit Report\nSubmit audited statement sheets to the governing board.",
                        dueDate: "2025-12-15",
                        status: "Complete",
                    },
                ],
            };

            // --- GRAPHQL API CONFIGURATION & CLIENT HANDLER ---
            const DEFAULT_GQL_CONFIG = {
                endpoint: "http://localhost:3000/graphql",
                authToken: "",
                useMockFallback: true,
            };

            let gqlConfig = JSON.parse(localStorage.getItem("omnitrack_gql_config")) || DEFAULT_GQL_CONFIG;

            function saveGqlConfig(config) {
                gqlConfig = config;
                localStorage.setItem("omnitrack_gql_config", JSON.stringify(config));
            }

            async function graphqlQuery(query, variables = {}) {
                try {
                    const headers = { "Content-Type": "application/json" };
                    if (gqlConfig.authToken) {
                        headers["Authorization"] = gqlConfig.authToken.startsWith("Bearer ")
                            ? gqlConfig.authToken
                            : `Bearer ${gqlConfig.authToken}`;
                    }

                    const response = await fetch(gqlConfig.endpoint, {
                        method: "POST",
                        headers,
                        body: JSON.stringify({ query, variables }),
                    });

                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    const result = await response.json();
                    if (result.errors) throw new Error(result.errors[0].message);
                    return result.data;
                } catch (err) {
                    if (gqlConfig.useMockFallback) {
                        console.warn(
                            `GraphQL endpoint [${gqlConfig.endpoint}] unreachable or CORS blocked (${err.message}). Using local mock resolver.`,
                        );
                        return mockGraphQLResolver(query, variables);
                    }
                    throw err;
                }
            }

            // Mock resolver simulating the backend GraphQL schema behavior
            function mockGraphQLResolver(query, variables) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        if (query.includes("query FetchFullData") || query.includes("roles {")) {
                            const mockRoles = appData.roles.map((r) => ({
                                id: r.id,
                                name: r.title,
                                description: r.description,
                                status: r.status,
                                responsibilities: appData.responsibilities
                                    .filter((resp) => resp.roleId === r.id)
                                    .map((resp) => ({
                                        id: resp.id,
                                        name: resp.title,
                                        description: resp.description,
                                        status: resp.status,
                                        requests: appData.requests
                                            .filter((req) => req.responsibilityId === resp.id)
                                            .map((req) => ({
                                                id: req.id,
                                                description: req.description,
                                                dueDate: req.dueDate,
                                                status: req.status,
                                            })),
                                    })),
                            }));
                            resolve({ roles: mockRoles });
                        } else if (query.includes("roleCreate")) {
                            const newId = "role-" + Date.now();
                            resolve({ roleCreate: { id: newId } });
                        } else if (query.includes("responsibilityCreate")) {
                            const newId = "resp-" + Date.now();
                            resolve({ responsibilityCreate: { id: newId } });
                        } else if (query.includes("responsibilityAssociateToRole")) {
                            resolve({ responsibilityAssociateToRole: true });
                        } else if (query.includes("requestCreate")) {
                            const newId = "req-" + Date.now();
                            resolve({ requestCreate: { id: newId } });
                        } else if (query.includes("requestAssociateToResponsibility")) {
                            resolve({ requestAssociateToResponsibility: true });
                        } else {
                            resolve({});
                        }
                    }, 100);
                });
            }

            // --- FETCH DATA FROM GRAPHQL & REFRESH STATE ---
            async function fetchDataFromGraphQL(showSuccessToast = true) {
                const refreshIcon = document.getElementById("refresh-icon");
                if (refreshIcon) {
                    refreshIcon.classList.remove("animate-spin", "animate-spin-once");
                    // Trigger reflow to restart animation reliably if clicked again
                    void refreshIcon.offsetWidth;
                    refreshIcon.classList.add("animate-spin-once");
                    setTimeout(() => {
                        refreshIcon.classList.remove("animate-spin-once");
                    }, 600);
                }

                try {
                    const fetchQuery = `
                    query FetchFullData {
                        roles {
                            id
                            name
                            description
                            status
                            responsibilities {
                                id
                                name
                                description
                                status
                                requests {
                                    id
                                    description
                                    dueDate
                                    status
                                }
                            }
                        }
                    }
                `;

                    const data = await graphqlQuery(fetchQuery);
                    if (data && data.roles && Array.isArray(data.roles)) {
                        const newRoles = [];
                        const newResponsibilities = [];
                        const newRequests = [];

                        data.roles.forEach((roleGql) => {
                            newRoles.push({
                                id: roleGql.id,
                                title: roleGql.name || "Untitled Role",
                                description: roleGql.description || "",
                                status: roleGql.status === "CLOSED" || roleGql.status === "Closed" ? "CLOSED" : "OPEN",
                                createdAt: new Date().toISOString().split("T")[0],
                            });

                            if (roleGql.responsibilities && Array.isArray(roleGql.responsibilities)) {
                                roleGql.responsibilities.forEach((respGql) => {
                                    newResponsibilities.push({
                                        id: respGql.id,
                                        roleId: roleGql.id,
                                        title: respGql.name || "Untitled Responsibility",
                                        description: respGql.description || "",
                                        status: respGql.status || "Active",
                                    });

                                    if (respGql.requests && Array.isArray(respGql.requests)) {
                                        respGql.requests.forEach((reqGql) => {
                                            newRequests.push({
                                                id: reqGql.id,
                                                responsibilityId: respGql.id,
                                                description: reqGql.description || "Untitled Request",
                                                dueDate: reqGql.dueDate || new Date().toISOString().split("T")[0],
                                                status: reqGql.status || "Ready",
                                            });
                                        });
                                    }
                                });
                            }
                        });

                        appData = {
                            roles: newRoles,
                            responsibilities: newResponsibilities,
                            requests: newRequests,
                        };
                        saveData();

                        expandedRoles.clear();
                        expandedResp.clear();

                        refreshActiveView();
                        if (showSuccessToast) showToast("Data synced with GraphQL backend");
                    }
                } catch (err) {
                    console.error("Failed to fetch from GraphQL backend:", err);
                    showToast(`Sync failed: ${err.message}`, "error");
                } finally {

                    type === "success"

                        : '<i data-lucide="alert-circle" class="w-4 h-4 text-rose-400"></i>';

                lucide.createIcons();

            // --- DATE & URGENCY UTILITIES ---
            function getDueDateStatus(dueDateStr, status) {
                if (status === "Complete")
                    return {
                        label: "Complete",
                        color: "bg-emerald-50 text-emerald-700 border-emerald-200",
                        dot: "bg-emerald-500",
                        urgency: 3,
                    };

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const dueParts = dueDateStr.split("-");
                const due =
                    dueParts.length === 3
                        ? new Date(parseInt(dueParts[0], 10), parseInt(dueParts[1], 10) - 1, parseInt(dueParts[2], 10))
                        : new Date(dueDateStr);
                due.setHours(0, 0, 0, 0);

                const diffDays = Math.round((due - today) / (1000 * 60 * 60 * 24));

                if (diffDays < 0) {
                    return {
                        label: `Overdue (${Math.abs(diffDays)}d)`,
                        color: "bg-rose-50 text-rose-700 border-rose-200",
                        dot: "bg-rose-500 animate-pulse",
                        urgency: 0,
                    };
                } else if (diffDays <= 3) {
                    return {
                        label: diffDays === 0 ? "Due Today" : `Due in ${diffDays}d`,
                        color: "bg-amber-50 text-amber-700 border-amber-200",
                        dot: "bg-amber-500",
                        urgency: 1,
                    };
                } else {
                    return {
                        label: `Due ${dueDateStr}`,
                        color: "bg-slate-50 text-slate-600 border-slate-200",
                        dot: "bg-slate-400",
                        urgency: 2,
                    };
                }
            }

            // --- RENDER TAB 2: MASTER REQUEST LIST ---
            function populateRoleFilterOptions() {
                const select = document.getElementById("req-filter-role");
                if (!select) return;
                const currentVal = select.value;
                let html = '<option value="ALL">All Roles</option>';
                appData.roles.forEach((r) => {
                    html += `<option value="${r.id}">${escapeHtml(r.title)}</option>`;
                });
                select.innerHTML = html;
                select.value = currentVal;
            }

            function renderRequestsList() {
                const container = document.getElementById("master-requests-container");
                const searchQuery = (document.getElementById("req-search")?.value || "").toLowerCase();
                const statusFilter = document.getElementById("req-filter-status")?.value || "ALL";
                const roleFilter = document.getElementById("req-filter-role")?.value || "ALL";

                let allReqs = [];
                appData.requests.forEach((req) => {
                    const resp = appData.responsibilities.find((r) => r.id === req.responsibilityId);
                    if (!resp) return;
                    const role = appData.roles.find((r) => r.id === resp.roleId);
                    if (!role) return;

                    allReqs.push({ req, resp, role });
                });

                allReqs = allReqs.filter(({ req, resp, role }) => {
                    if (statusFilter !== "ALL" && req.status !== statusFilter) return false;
                    if (roleFilter !== "ALL" && role.id !== roleFilter) return false;
                    if (
                        searchQuery &&
                        !req.description.toLowerCase().includes(searchQuery) &&
                        !resp.title.toLowerCase().includes(searchQuery) &&
                        !role.title.toLowerCase().includes(searchQuery)
                    )
                        return false;
                    return true;
                });

                allReqs.sort((a, b) => {
                    const statA = getDueDateStatus(a.req.dueDate, a.req.status);
                    const statB = getDueDateStatus(b.req.dueDate, b.req.status);

                    if (statA.urgency !== statB.urgency) {
                        return statA.urgency - statB.urgency;
                    }
                    return new Date(a.req.dueDate) - new Date(b.req.dueDate);
                });

                                <option value="Ready" ${req.status === "Ready" ? "selected" : ""}>Ready</option>
                                <option value="Working" ${req.status === "Working" ? "selected" : ""}>Working</option>
                                <option value="Complete" ${req.status === "Complete" ? "selected" : ""}>Complete</option>
                            </select>
                            <button onclick="openModal('request', '${req.id}')" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all border border-slate-200 bg-white" title="Edit Request">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteRequest('${req.id}')" class="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all border border-slate-200 bg-white" title="Delete Request">

                            </button>
                        </div>
                    </div>
                `;
                });

                container.innerHTML = html;
                lucide.createIcons();

            // --- MODAL & FORM HANDLERS ---
            let currentModalType = null;
            let currentEditingId = null;
            let currentParentId = null;

            function openModal(type, id = null, parentId = null) {
                currentModalType = type;
                currentEditingId = id;
                currentParentId = parentId;

                            <textarea id="role-desc" rows="6" placeholder="## Overview&#10;Describe responsibilities and resources..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[11px] focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">${role ? role.description : ""}</textarea>

            function closeModal() {

            let activeRespIndex = -1;

            function showResponsibilityDropdown() {
                const dropdown = document.getElementById("resp-dropdown-options");
                if (dropdown) dropdown.classList.remove("hidden");
            }

            function filterResponsibilityOptions(query = "") {
                const container = document.getElementById("resp-dropdown-options");
                if (!container) return;

                activeRespIndex = -1;
                const q = query.toLowerCase().trim();
                const currentSelectedId = document.getElementById("req-resp-id")?.value;
                let html = "";
                let globalIndex = 0;

                appData.roles.forEach((role) => {
                    const resps = appData.responsibilities.filter((r) => r.roleId === role.id);
                    const matchingResps = resps.filter(
                        (resp) => !q || resp.title.toLowerCase().includes(q) || role.title.toLowerCase().includes(q),
                    );

                    if (matchingResps.length > 0) {
                        html += `<div class="p-1.5 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-wider select-none">${escapeHtml(role.title)}</div>`;
                        matchingResps.forEach((resp) => {
                            const isSelected = resp.id === currentSelectedId;
                            const label = `${escapeHtml(role.title)} › ${escapeHtml(resp.title)}`;
                            html += `
                            <button type="button" 
                                id="resp-opt-${globalIndex}"
                                data-index="${globalIndex}"
                                data-id="${resp.id}"
                                data-label="${label}"
                                onclick="selectResponsibilityOption('${resp.id}', '${label}')"
                                class="resp-option-btn w-full text-left px-3 py-2 text-xs flex items-center justify-between hover:bg-indigo-50 hover:text-indigo-600 transition-colors ${isSelected ? "bg-indigo-50/70 text-indigo-600 font-medium" : "text-slate-700"}">
                                <span>${escapeHtml(resp.title)}</span>
                                ${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5 text-indigo-600"></i>' : ""}
                            </button>
                        `;
                            globalIndex++;
                        });
                    }
                });

                if (!html) {
                    html = `<div class="p-3 text-xs text-slate-400 text-center select-none">No matching responsibilities found</div>`;
                }

                container.innerHTML = html;
                lucide.createIcons();
            }

            function handleRespKeyDown(e) {
                const dropdown = document.getElementById("resp-dropdown-options");
                const options = containerOptions();

                if (
                    dropdown &&
                    dropdown.classList.contains("hidden") &&
                    (e.key === "ArrowDown" || e.key === "ArrowUp")
                ) {
                    showResponsibilityDropdown();
                }

                if (options.length === 0) return;

                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    activeRespIndex = (activeRespIndex + 1) % options.length;
                    updateActiveRespOption(options);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    activeRespIndex = (activeRespIndex - 1 + options.length) % options.length;
                    updateActiveRespOption(options);
                } else if (e.key === "Enter") {
                    if (activeRespIndex >= 0 && activeRespIndex < options.length) {
                        e.preventDefault();
                        const selectedBtn = options[activeRespIndex];
                        selectResponsibilityOption(selectedBtn.dataset.id, selectedBtn.dataset.label);
                    }
                } else if (e.key === "Escape") {
                    if (dropdown) dropdown.classList.add("hidden");
                }
            }

            function containerOptions() {
                const container = document.getElementById("resp-dropdown-options");
                return container ? Array.from(container.querySelectorAll(".resp-option-btn")) : [];
            }

            function updateActiveRespOption(options) {
                options.forEach((opt, idx) => {
                    if (idx === activeRespIndex) {
                        opt.classList.add("bg-indigo-100", "text-indigo-700");
                        opt.scrollIntoView({ block: "nearest" });
                    } else {
                        opt.classList.remove("bg-indigo-100", "text-indigo-700");
                    }
                });
            }

                const inputHidden = document.getElementById("req-resp-id");

                const dropdown = document.getElementById("resp-dropdown-options");

                if (inputHidden) inputHidden.value = respId;
                if (inputText) inputText.value = label;
                if (dropdown) dropdown.classList.add("hidden");

            function clearRespSelection() {
                const inputHidden = document.getElementById("req-resp-id");

            // --- GRAPHQL CONFIG & TEST HANDLERS ---
            async function saveConfig(e) {
                e.preventDefault();
                const endpoint = document.getElementById("cfg-endpoint").value.trim();
                const authToken = document.getElementById("cfg-token").value.trim();
                const useMockFallback = document.getElementById("cfg-fallback").checked;

                saveGqlConfig({ endpoint, authToken, useMockFallback });
                showToast("GraphQL settings saved successfully");
                closeModal();
                await fetchDataFromGraphQL();
            }

            async function testGqlConnection() {
                const resultDiv = document.getElementById("test-connection-result");
                const endpoint = document.getElementById("cfg-endpoint").value.trim();
                const authToken = document.getElementById("cfg-token").value.trim();

                if (!resultDiv) return;
                resultDiv.className = "text-xs p-3 rounded-xl bg-slate-100 text-slate-600 flex items-center gap-2";
                resultDiv.innerHTML =
                    '<i data-lucide="loader-2" class="w-4 h-4 animate-spin text-indigo-600"></i> Testing GraphQL Endpoint...';
                resultDiv.classList.remove("hidden");
                lucide.createIcons();

                try {
                    const headers = { "Content-Type": "application/json" };
                    if (authToken) {
                        headers["Authorization"] = authToken.startsWith("Bearer ") ? authToken : `Bearer ${authToken}`;
                    }

                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers,
                        body: JSON.stringify({ query: "{ roles { id } }" }),
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.errors) {
                            resultDiv.className =
                                "text-xs p-3 rounded-xl bg-amber-50 text-amber-800 border border-amber-200 flex items-center gap-2";
                            resultDiv.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i> Server reached, but GraphQL returned error: ${result.errors[0].message}`;
                        } else {
                            resultDiv.className =
                                "text-xs p-3 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 flex items-center gap-2";
                            resultDiv.innerHTML =
                                '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i> Connection successful! Server CORS and headers verified.';
                        }
                    } else {
                        resultDiv.className =
                            "text-xs p-3 rounded-xl bg-amber-50 text-amber-800 border border-amber-200 flex items-center gap-2";
                        resultDiv.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600"></i> Server responded with HTTP status ${response.status}`;
                    }
                } catch (err) {
                    resultDiv.className =
                        "text-xs p-3 bg-rose-50 text-rose-800 border border-rose-200 rounded-xl space-y-1";
                    resultDiv.innerHTML = `
                    <div class="flex items-center gap-2 font-semibold">
                        <i data-lucide="x-circle" class="w-4 h-4 text-rose-600 shrink-0"></i> Connection failed (${err.message})
                    </div>
                    <p class="text-[11px] text-rose-700 pl-6">
                        Ensure your GraphQL server is active at <code>${escapeHtml(endpoint)}</code> and matches your allowed origin/headers config.
                    </p>
                `;
                }
                lucide.createIcons();
            }

            // --- DATABASE MUTATIONS VIA GRAPHQL ---
            async function saveRole(e) {
                e.preventDefault();
                const title = document.getElementById("role-title").value.trim();
                const description = document.getElementById("role-desc").value.trim();
                const statusEl = document.getElementById("role-status");
                const status = statusEl ? statusEl.value : "OPEN";

                if (currentEditingId) {
                    const role = appData.roles.find((r) => r.id === currentEditingId);
                    if (role) {
                        role.title = title;
                        role.description = description;
                        role.status = status;
                    }
                    showToast("Role updated successfully");
                } else {
                    const gqlMutation = `
                    mutation RoleCreate($name: String, $description: String) {
                        roleCreate(name: $name, description: $description) {
                            id
                        }
                    }
                `;
                    const data = await graphqlQuery(gqlMutation, { name: title, description });
                    const newId = data?.roleCreate?.id || "role-" + Date.now();

                    const newRole = {
                        id: newId,
                        title,
                        description,
                        status: "OPEN",
                        createdAt: new Date().toISOString().split("T")[0],
                    };
                    appData.roles.push(newRole);
                    expandedRoles.add(newRole.id);
                    showToast("Role saved successfully");
                }

                saveData();
                closeModal();
                refreshActiveView();
            }

            function toggleRoleStatus(id) {
                const role = appData.roles.find((r) => r.id === id);
                if (role) {
                    role.status = role.status === "OPEN" ? "CLOSED" : "OPEN";
                    saveData();
                    showToast(`Role status changed to ${role.status}`);
                    refreshActiveView();
                }
            }

            function deleteRole(id) {
                if (
                    confirm(
                        "Are you sure you want to delete this role and all its nested responsibilities and requests?",
                    )
                ) {
                    const respIds = appData.responsibilities.filter((r) => r.roleId === id).map((r) => r.id);
                    appData.requests = appData.requests.filter((req) => !respIds.includes(req.responsibilityId));
                    appData.responsibilities = appData.responsibilities.filter((r) => r.roleId !== id);
                    appData.roles = appData.roles.filter((r) => r.id !== id);
                    saveData();
                    showToast("Role deleted successfully");
                    refreshActiveView();
                }
            }

            async function saveResponsibility(e) {
                e.preventDefault();
                const roleId = document.getElementById("resp-role-id").value;
                const title = document.getElementById("resp-title").value.trim();
                const description = document.getElementById("resp-desc").value.trim();
                const status = document.getElementById("resp-status").value;

                if (currentEditingId) {
                    const resp = appData.responsibilities.find((r) => r.id === currentEditingId);
                    if (resp) {
                        resp.roleId = roleId;
                        resp.title = title;
                        resp.description = description;
                        resp.status = status;
                    }
                    showToast("Responsibility updated successfully");
                } else {
                    const createRespMutation = `
                    mutation ResponsibilityCreate($name: String, $description: String) {
                        responsibilityCreate(name: $name, description: $description) {
                            id
                        }
                    }
                `;
                    const respData = await graphqlQuery(createRespMutation, { name: title, description });
                    const respId = respData?.responsibilityCreate?.id || "resp-" + Date.now();

                    const associateMutation = `
                    mutation ResponsibilityAssociateToRole($roleId: String, $responsibilityId: String) {
                        responsibilityAssociateToRole(roleId: $roleId, responsibilityId: $responsibilityId)
                    }
                `;
                    await graphqlQuery(associateMutation, { roleId, responsibilityId: respId });

                    const newResp = {
                        id: respId,
                        roleId,
                        title,
                        description,
                        status,
                    };
                    appData.responsibilities.push(newResp);
                    expandedResp.add(newResp.id);
                    expandedRoles.add(roleId);
                    showToast("Responsibility created & linked");
                }

                saveData();
                closeModal();
                refreshActiveView();
            }

            function deleteResponsibility(id) {
                if (confirm("Are you sure you want to delete this responsibility and its associated requests?")) {
                    appData.requests = appData.requests.filter((req) => req.responsibilityId !== id);
                    appData.responsibilities = appData.responsibilities.filter((r) => r.id !== id);
                    saveData();
                    showToast("Responsibility deleted successfully");
                    refreshActiveView();
                }
            }

            async function saveRequest(e) {
                e.preventDefault();
                const responsibilityId = document.getElementById("req-resp-id").value;
                const description = document.getElementById("req-desc").value.trim();
                const dueDate = document.getElementById("req-due-date").value;
                const status = document.getElementById("req-status").value;

                if (!responsibilityId) {
                    alert("Please select a parent responsibility.");
                    return;
                }

                if (currentEditingId) {
                    const req = appData.requests.find((r) => r.id === currentEditingId);
                    if (req) {
                        req.responsibilityId = responsibilityId;
                        req.description = description;
                        req.dueDate = dueDate;
                        req.status = status;
                    }
                    showToast("Request updated successfully");
                } else {
                    const createReqMutation = `
                    mutation RequestCreate($dueDate: String, $description: String) {
                        requestCreate(dueDate: $dueDate, description: $description) {
                            id
                        }
                    }
                `;
                    const reqData = await graphqlQuery(createReqMutation, { dueDate, description });
                    const reqId = reqData?.requestCreate?.id || "req-" + Date.now();

                    const associateReqMutation = `
                    mutation RequestAssociateToResponsibility($responsibilityId: String, $requestId: String) {
                        requestAssociateToResponsibility(responsibilityId: $responsibilityId, requestId: $requestId)
                    }
                `;
                    await graphqlQuery(associateReqMutation, { responsibilityId, requestId: reqId });

                    const newReq = {
                        id: reqId,
                        responsibilityId,
                        description,
                        dueDate,
                        status,
                    };
                    appData.requests.push(newReq);
                    const resp = appData.responsibilities.find((r) => r.id === responsibilityId);
                    if (resp) expandedResp.add(resp.id);
                    showToast("Request created & linked");
                }

                saveData();
                closeModal();
                refreshActiveView();
            }

            function updateRequestStatus(id, newStatus) {
                const req = appData.requests.find((r) => r.id === id);
                if (req) {
                    req.status = newStatus;
                    saveData();
                    showToast(`Request status updated to ${newStatus}`);
                    refreshActiveView();
                }
            }

            function deleteRequest(id) {
                if (confirm("Are you sure you want to delete this request?")) {
                    appData.requests = appData.requests.filter((req) => req.id !== id);
                    saveData();
                    showToast("Request deleted successfully");
                    refreshActiveView();
                }
            }

            function refreshActiveView() {
                if (activeTab === "hierarchy") {
                    renderHierarchy();
                } else {
                    renderRequestsList();
                }
            }

            function resetData() {
                if (confirm("Reset application data back to default sample roles and requests?")) {
                    appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    expandedRoles = new Set();
                    expandedResp = new Set();
                    saveData();
                    showToast("Data reset to defaults successfully");
                    refreshActiveView();
                }
            }

            function exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
                const downloadAnchor = document.createElement("a");
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute(
                    "download",
                    `omnitrack_backup_${new Date().toISOString().split("T")[0]}.json`,
                );
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast("Data exported successfully");
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // --- NEW ITEM DROPDOWN HANDLERS ---
            function toggleNewMenu(e) {
                if (e) e.stopPropagation();
                const dropdown = document.getElementById("new-item-dropdown");
                const settingsDropdown = document.getElementById("settings-dropdown");
                if (settingsDropdown) settingsDropdown.classList.add("hidden");
                dropdown.classList.toggle("hidden");
            }

            function handleNewMenuAction(type) {
                const dropdown = document.getElementById("new-item-dropdown");
                dropdown.classList.add("hidden");
                openModal(type);
            }

            // --- SETTINGS DROPDOWN HANDLERS ---
            function toggleSettingsMenu(e) {
                if (e) e.stopPropagation();
                const settingsDropdown = document.getElementById("settings-dropdown");
                const newDropdown = document.getElementById("new-item-dropdown");
                if (newDropdown) newDropdown.classList.add("hidden");
                settingsDropdown.classList.toggle("hidden");
            }

            function handleSettingsMenuAction(action) {
                const settingsDropdown = document.getElementById("settings-dropdown");
                settingsDropdown.classList.add("hidden");
                if (action === "config") {
                    openModal("config");
                } else if (action === "reset") {
                    resetData();
                } else if (action === "export") {
                    exportData();
                }
            }

            document.addEventListener("click", function (e) {
                const newContainer = document.getElementById("new-item-menu-container");
                const newDropdown = document.getElementById("new-item-dropdown");
                if (newContainer && !newContainer.contains(e.target) && newDropdown) {
                    newDropdown.classList.add("hidden");
                }

                const settingsContainer = document.getElementById("settings-menu-container");
                const settingsDropdown = document.getElementById("settings-dropdown");
                if (settingsContainer && !settingsContainer.contains(e.target) && settingsDropdown) {
                    settingsDropdown.classList.add("hidden");
                }
            });

            // Initialize App on Window Load
            window.onload = function () {
                lucide.createIcons();
                renderHierarchy();
            };
        </script>
    </body>
</html>
